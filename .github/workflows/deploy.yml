# Сборка на GitHub (серверу с 1 ГБ памяти next build не по силам) и выкладка на VPS.
# Секреты репозитория: DEPLOY_HOST, DEPLOY_SSH_KEY (приватный ключ пользователя deploy).
# Переменные репозитория: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_TG_APP_URL.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TG_APP_URL: ${{ vars.NEXT_PUBLIC_TG_APP_URL }}
        run: |
          ok=1
          for name in DEPLOY_HOST DEPLOY_SSH_KEY; do
            [ -n "$(printenv $name)" ] || { echo "::error::Нет секрета $name (Settings → Secrets and variables → Actions → Secrets → Repository secrets)"; ok=0; }
          done
          for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_TG_APP_URL; do
            [ -n "$(printenv $name)" ] || { echo "::error::Нет переменной $name (Settings → Secrets and variables → Actions → Variables → Repository variables)"; ok=0; }
          done
          [ $ok = 1 ]

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TG_APP_URL: ${{ vars.NEXT_PUBLIC_TG_APP_URL }}

      # standalone не включает статику - докладываем её рядом с server.js
      - name: Pack
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf front.tar.gz -C .next/standalone .

      - name: Upload and release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/deploy_key
          # ключ, вставленный из Windows, приходит с \r - чистим
          printf '%s\n' "$KEY" | tr -d '\r' > ~/deploy_key
          ssh-keygen -y -f ~/deploy_key > /dev/null || { echo "::error::DEPLOY_SSH_KEY повреждён: вставьте файл ключа целиком, от -----BEGIN до -----END"; exit 1; }
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i $HOME/deploy_key -o BatchMode=yes deploy@$HOST"
          scp -i ~/deploy_key -o BatchMode=yes front.tar.gz "deploy@$HOST:/tmp/front-$GITHUB_SHA.tar.gz"
          $SSH "sudo /usr/local/bin/stalzone-front-release /tmp/front-$GITHUB_SHA.tar.gz $GITHUB_SHA"
